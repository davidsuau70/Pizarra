<style>

const vin=-s.vy;const hs=Math.hypot(s.vx,s.vz)||1;const tsp=(s.wx*s.vz-s.wz*s.vx)/hs;const fr=clamp(0.8+0.0005*tsp,0.7,0.9);s.y=RB;s.vy=vin*clamp(0.74+0.0003*tsp,0.68,0.8);if(s.vy<0.4)s.vy=0;s.vx*=fr;s.vz*=fr;s.wx*=0.7;s.wz*=0.7;

function fly(P,v,w){
const s={x:P.x,y:P.y,z:P.z,vx:v.x,vy:v.y,vz:v.z,wx:w.x,wy:w.y,wz:w.z};

}
function solveAngle(P,d,m,wm,D){

if(Math.abs(e.r-D)>0.5||e.ynet===null||e.ynet<1.0)return null;
return{m,el};
}

function stepText(i){const s=EX.steps[i];if(!s)return'';return(i+1)+'. '+s.who+' · '+SHL[s.shot]+(s.side==='f'?' (derecha)':s.side==='b'?' (revés)':'')}
function planStep(i){
const stp=EX.steps[i],o=PLM[stp.who];
if(!o||!o.active)return{err:'el jugador '+stp.who+' no está en la pista'};
o.team=o.pos.z>0?0:1;
const sg=o.team===0?1:-1,first=i===0;
shotCount=first?0:2;
const cands=predict(sg,first);
if(!cands.length)return{err:'la bola no llega a una zona golpeable de '+stp.who+'. Cambia el destino del golpe anterior o el jugador.'};
const pref=first?['serve']:(stp.contact==='bote'?['ground','volley','over']:stp.contact==='vuelo'?['volley','over','ground']:KP[stp.shot]);
const stys=STY[stp.shot]||['fh','bh'];
const list=stp.side==='f'?[stys[0]]:stp.side==='b'?[stys[1]||stys[0]]:stys;
const opts=c=>{let best=null;for(const sty of list){const b=bodyFor(o,c.P,sty);const d=Math.hypot(b.x-o.pos.x,b.z-o.pos.z);const bk=stys.length>1&&sty===stys[1];const t=moveTime(d)+0.11+((bk&&(!stp.side||stp.side==='a'))?0.17:0);if(!best||t<best.t)best={sty,t,d,bk}}return best};
let pick=null;
for(const k of pref){for(const c of cands){if(c.kind!==k)continue;const op=opts(c);if(op.t<=c.i*DT-0.05){pick={c,op};break}}if(pick)break}
if(!pick){for(const k of pref){const c=cands.find(c=>c.kind===k);if(c){pick={c,op:opts(c)};break}}}
if(!pick){const c=cands[0];pick={c,op:opts(c)}}
const c=pick.c,op=pick.op,P=c.P;
const sol=solveShotTo(stp.shot,P,stp.to,o.hand);
const type=sol.type,back=op.bk;
const sty=type===stp.shot?op.sty:styOf(type,back),body=bodyFor(o,P,sty);
const tc=(simStep+c.i)*DT,jump=(type==='smash'&&P.y>2.0)||P.y>2.4;
const dist=Math.hypot(body.x-o.pos.x,body.z-o.pos.z),vmax=clamp(dist/Math.max(0.2,c.i*DT-0.12)*1.15,4.4,9);
const notes=[];
if(sol.note)notes.push(sol.note);
if(!first&&['band','vib','smash'].includes(stp.shot)&&c.kind!=='over')notes.push('la bola no llega alta: se juega tras el bote');
if(!first&&['volley','block'].includes(stp.shot)&&c.kind==='ground')notes.push('se juega tras el bote, no al vuelo');
const pl={player:o,i,team:o.team,step:simStep+c.i,tc,P,kind:c.kind,type,sty,back,v:sol.v,w:sol.w,dir:sol.dir,T:stp.to,body,yawS:body.yaw,jump,vmax,note:notes.join(' · ')};
o.swing={tc,P,type,sty,dir:sol.dir,jump,yawS:body.yaw};
PL.forEach(q=>{if(q.active&&q.team!==o.team)q.hop={t0:tc-0.26,t1:tc-0.02}});
return{plan:pl};
}
function stepStart(i){

setTargets(i);
const r=planStep(i);
if(r.err){state='stuck';plan=null;setWarn('Paso '+(i+1)+': '+r.err);setCap('Ejercicio detenido en el paso '+(i+1));return}

}
function dropBall(){const o=PLM[EX.steps[0].who];const sg=o.team===0?1:-1;ball.x=o.pos.x+(sg>0?-0.35:0.35)*o.hand;ball.z=o.pos.z-sg*0.55;ball.y=1.6;ball.vx=ball.vy=ball.vz=ball.wx=ball.wy=ball.wz=0}

function doHit(){
const pl=plan;plan=null;const o=pl.player;
ball.vx=pl.v.x;ball.vy=pl.v.y;ball.vz=pl.v.z;ball.wx=pl.w.x;ball.wy=pl.w.y;ball.wz=pl.w.z;

function updPlayer(o,Tn){
const sw=o.swing,st=sw?ST[sw.sty]:null,sg=o.team===0?1:-1;
let a;const hit=plan&&plan.player===o;
if(hit)a=plan.body;else if(sw&&Tn<sw.tc+0.2)a=null;else a=o.tgt;
let dx=0,dz=0,dist=0;if(a){dx=a.x-o.pos.x;dz=a.z-o.pos.z;dist=Math.hypot(dx,dz)}
const vm=hit?plan.vmax:4.4;
const want=dist<0.03?0:Math.min(vm,Math.sqrt(2*9*dist));
const wx=dist>1e-3?dx/dist*want:0,wz=dist>1e-3?dz/dist*want:0;
let ax=wx-o.vel.x,az=wz-o.vel.z;const al=Math.hypot(ax,az),mx=8.5*DT*(vm/5)*(want<Math.hypot(o.vel.x,o.vel.z)?1.1:1);
if(al>mx){ax*=mx/al;az*=mx/al}
o.vel.x+=ax;o.vel.z+=az;
o.pos.x=clamp(o.pos.x+o.vel.x*DT,-4.85,4.85);
o.pos.z=sg>0?clamp(o.pos.z+o.vel.z*DT,0.5,9.7):clamp(o.pos.z+o.vel.z*DT,-9.7,-0.5);
const sp=Math.hypot(o.vel.x,o.vel.z);
let yt=netYaw(o);
if(sw&&Tn>sw.tc+st.tp-0.28&&Tn<sw.tc+st.tr-0.1)yt=sw.yawS;
else if(o.vel.z*sg>1.5&&dist>1.6&&sp>2.2)yt=netYaw(o)+1.05*o.hand;
o.yaw+=clamp(wrap(yt-o.yaw),-14*DT,14*DT);
if(sw&&Tn>sw.tc+st.tr+0.1)o.swing=null;
if(o.hop&&Tn>o.hop.t1)o.hop=null;
}

}else if(state==='done'&&repeatT>0){repeatT-=DT;if(repeatT<=0)startRun()}

}

const p=mapPt(e),h=hitTest(p);if(!h)return;
if(e.preventDefault)e.preventDefault();
if(h.kind==='target'){dragS={kind:'target',j:h.j,cur:{x:rd(p.x),z:rd(p.z)}};sel=h.j;renderSteps();renderForm()}
else if(tool==='shot'){dragS={kind:'shot',id:h.id,cur:{x:rd(p.x),z:rd(p.z)},p0:p}}
else{dragS={kind:'move',id:h.id,cur:{x:rd(p.x),z:rd(p.z)}}}
try{$('map').setPointerCapture(e.pointerId)}catch(err){}
drawMap();
});
$('map').addEventListener('pointermove',e=>{
if(!dragS)return;const p=mapPt(e);dragS.cur={x:rd(p.x),z:rd(p.z)};
if(dragS.kind==='move'){const q=EX.steps[sel];if(q){q.pos=q.pos||{};q.pos[dragS.id]=dragS.cur}else if(EX.players[dragS.id]){EX.players[dragS.id].x=dragS.cur.x;EX.players[dragS.id].z=dragS.cur.z}}
else if(dragS.kind==='target'){EX.steps[dragS.j].to=dragS.cur}
drawMap();
});
function endDrag(e){
if(!dragS)return;const d=dragS;dragS=null;
if(d.kind==='shot'){
const a=posAt(sel)[d.id];
if(a&&Math.hypot(a.x-d.cur.x,a.z-d.cur.z)>0.8){
const ns={who:d.id,shot:$('ss').value,to:d.cur,side:'a',contact:'auto'};
EX.steps.splice(EX.steps.length?sel+1:0,0,ns);sel=EX.steps.length>1?sel+1:0;
}else{const j=EX.steps.findIndex(s=>s.who===d.id);if(j>=0)sel=j}
}
setWarn('');touch();
}
$('map').addEventListener('pointerup',endDrag);
$('map').addEventListener('pointercancel',endDrag);
$('steps').addEventListener('click',e=>{const b=e.target.closest?e.target.closest('[data-i]'):null;if(!b)return;sel=parseInt(b.dataset.i);touch()});
['sw','ss','sc','sd'].forEach(id=>$(id).addEventListener('change',()=>{const s=EX.steps[sel];if(!s)return;s.who=$('sw').value;s.shot=$('ss').value;s.contact=$('sc').value;s.side=$('sd').value;touch()}));
$('chips').addEventListener('click',e=>{const b=e.target.closest?e.target.closest('[data-p]'):null;if(!b)return;selP=b.dataset.p;renderChips()});
$('tmove').addEventListener('click',()=>{tool='move';renderChips()});
$('tshot').addEventListener('click',()=>{tool='shot';renderChips()});
$('pres').addEventListener('click',()=>{if(EX.players[selP]){delete EX.players[selP]}else{EX.players[selP]={x:DEFP[selP].x,z:DEFP[selP].z,hand:1}}touch()});
$('lef').addEventListener('click',()=>{const d=EX.players[selP];if(!d)return;d.hand=d.hand===-1?1:-1;touch()});
$('up').addEventListener('click',()=>{if(sel>0){const t=EX.steps[sel];EX.steps[sel]=EX.steps[sel-1];EX.steps[sel-1]=t;sel--;touch()}});
$('dn').addEventListener('click',()=>{if(sel<EX.steps.length-1){const t=EX.steps[sel];EX.steps[sel]=EX.steps[sel+1];EX.steps[sel+1]=t;sel++;touch()}});
$('del').addEventListener('click',()=>{if(!EX.steps.length)return;EX.steps.splice(sel,1);sel=Math.max(0,Math.min(sel,EX.steps.length-1));touch()});
$('txt').addEventListener('click',()=>{const t=$('ta'),l=$('load');const show=t.style.display==='none';t.style.display=show?'block':'none';l.style.display=show?'block':'none';if(show)t.value=JSON.stringify(EX)});
$('load').addEventListener('click',()=>{try{const o=JSON.parse($('ta').value);if(!o.players||!Array.isArray(o.steps))throw new Error('formato');EX=o;sel=0;touch();setWarn('')}catch(err){setWarn('Texto no válido: '+err.message)}});
$('pre').addEventListener('change',()=>{const k=$('pre').value;if(!k)return;EX=clone(PRE[k]);sel=0;touch();$('pre').value=''});
$('clr').addEventListener('click',()=>{EX={name:'',players:{A1:{x:-2.4,z:3.0,hand:1},B1:{x:2.4,z:-7.5,hand:1}},steps:[]};sel=0;touch()});
$('nm').addEventListener('input',()=>{EX.name=$('nm').value});
const pp=$('pp'),ppi=$('ppi'),spd=$('sp');
function icon(){ppi.textContent=playing?'❚❚':'▶'}
pp.addEventListener('click',()=>{playing=!playing;icon();pp.blur()});
spd.addEventListener('change',()=>{speed=parseFloat(spd.value);spd.blur()});
$('play').addEventListener('click',()=>{playing=true;icon();startRun();$('play').blur()});

let PRmax=Math.min(window.devicePixelRatio||1,3),PR=Math.min(PRmax,2.5),ftS=0,ftN=0;
R.setPixelRatio(PR);R.setSize(lastW,H,false);

function render(dt,adt){
const Tn=simStep*DT+acc;
for(const o of PL)if(o.active)animate(o,Tn,adt,acc);
let bx,by,bz,vis=true;
if(state==='idle'||state==='prep'){const s0=EX.steps[0],o=s0&&PLM[s0.who];if(o&&o.active){const sg=o.team===0?1:-1;bx=o.pos.x+(sg>0?-0.3:0.3)*o.hand;by=1.05;bz=o.pos.z-sg*0.4}else{vis=false;bx=0;by=1;bz=0}}
else{bx=ball.x+(state==='play'||state==='tail'?ball.vx*acc:0);by=Math.max(RB,ball.y+(state==='play'||state==='tail'?ball.vy*acc:0));bz=ball.z+(state==='play'||state==='tail'?ball.vz*acc:0)}
bm.visible=vis;bsh.visible=vis;
bm.position.set(bx,by,bz);bsh.position.set(bx,0.03,bz);const k=1/(1+by*0.25);bsh.scale.set(k,k,1);bsh.material.opacity=0.4*k;
const a=trail.geometry.attributes.position;
for(let i=0;i<NT;i++){const p=trailPts.length?trailPts[Math.min(trailPts.length-1,Math.max(0,trailPts.length-1-(NT-1-i)))]:[bx,by,bz];a.setXYZ(i,p[0],p[1],p[2])}
a.setXYZ(NT-1,bx,by,bz);a.needsUpdate=true;trail.visible=vis&&trailPts.length>0;
rings.forEach(r=>{const age=Tn-r.t0;if(age>=0&&age<0.45){r.m.visible=true;const s=0.5+age*5;r.m.scale.set(s,s,s);r.m.material.opacity=1-age/0.45;if(r.k==='b')r.m.lookAt(cam.position)}else r.m.visible=false});
const kk=1-Math.exp(-dt*6);
if(mode==='ball'){tmp.set(bx,by*0.5+0.5,bz);tgt.lerp(tmp,kk)}else tgt.lerp(home,kk);
const k2=Math.round(cur.th/(2*Math.PI));if(k2){cur.th-=k2*2*Math.PI;goal.th-=k2*2*Math.PI}
cur.th=lerp(cur.th,goal.th,kk);cur.ph=lerp(cur.ph,goal.ph,kk);cur.r=lerp(cur.r,goal.r,kk);
if(Math.abs(cur.fov-goal.fov)>0.05){cur.fov=lerp(cur.fov,goal.fov,kk);cam.fov=cur.fov;cam.updateProjectionMatrix()}
cam.position.set(tgt.x+cur.r*Math.sin(cur.ph)*Math.sin(cur.th),tgt.y+cur.r*Math.cos(cur.ph),tgt.z+cur.r*Math.sin(cur.ph)*Math.cos(cur.th));cam.lookAt(tgt);
}
function frame(now){
const dt=Math.min(0.05,(now-last)/1000);last=now;
if(!videoOn){requestAnimationFrame(frame);return}
ftS+=dt;ftN++;if(ftN>=90){const avg=ftS/ftN;if(avg>0.026&&PR>1.5){PR=Math.max(1.5,PR-0.5);R.setPixelRatio(PR);R.setSize(lastW,H,false)}ftS=0;ftN=0}
let adt=0;
if(playing){acc+=dt*speed;adt=dt*speed;let n=0;while(acc>=DT&&n<480){stepSim();acc-=DT;n++}if(n>=480)acc=0}
try{render(dt,adt);R.render(S,cam)}catch(e){capE.textContent='Error: '+e.message;return}
requestAnimationFrame(frame);
}
if(window.ResizeObserver){new ResizeObserver(es=>{const w=Math.round(es[0].contentRect.width);if(w&&w!==lastW){lastW=w;R.setSize(w,H,false);cam.aspect=w/H;cam.updateProjectionMatrix()}}).observe(cv)}

$('ss').value='drive';EX=clone(PRE.jugada);sel=0;showEdit();refreshUI();showTab('board');
requestAnimationFrame(frame);

}catch(e){capE.textContent='Error: '+e.message}
})();
</script>

</body></html>
